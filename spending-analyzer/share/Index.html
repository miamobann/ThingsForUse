<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지출 분석</title>
<style>:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fcfcfb; --surface-2: #f0efeb; --line: #e2e0da;
  --text: #1b1b19; --text-2: #52514e; --muted: #85837d; --accent: #2a78d6; --accent-ink: #fff;
  --warn: #b35c00; --bad: #c7362f; --good: #1d7a3e;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s-other: #a8a69f;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #33332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8d85; --accent: #3987e5; --accent-ink: #fff;
    --warn: #e09a3c; --bad: #e66767; --good: #4cb06e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #6b6a64;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #33332f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8d85; --accent: #3987e5; --accent-ink: #fff;
  --warn: #e09a3c; --bad: #e66767; --good: #4cb06e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #6b6a64;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0 8px 0 0; }
nav { display: flex; gap: 4px; }
nav button { border: 0; background: none; color: var(--text-2); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; margin-left: 4px; }
main { max-width: 1280px; margin: 0 auto; padding: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > .card { margin-bottom: 0; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.tile .k { color: var(--text-2); font-size: 12.5px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .d { color: var(--muted); font-size: 12px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
select, input[type=text], input[type=password], input[type=month], input[type=search] {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn.small { padding: 2px 8px; font-size: 12.5px; }
button.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--text-2); padding: 6px 10px; font: inherit; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td:first-child { white-space: nowrap; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
th.sortable { cursor: pointer; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.memo { color: var(--muted); font-size: 12.5px; max-width: 320px; }
tr.off td { color: var(--muted); text-decoration: line-through; }
tr.off td select { text-decoration: none; }
.tablewrap { overflow-x: auto; }
.muted { color: var(--muted); }
.warn { color: var(--warn); }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; background: var(--surface-2); color: var(--text-2); font-size: 12px; white-space: nowrap; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--text-2); }
.drop.over { border-color: var(--accent); background: var(--surface-2); }
.empty { text-align: center; padding: 60px 20px; color: var(--text-2); }
.catrow { display: grid; grid-template-columns: 150px 1fr 110px 54px; gap: 10px; align-items: center; padding: 5px 0; cursor: pointer; }
.catrow.subrow { grid-template-columns: 150px 1fr 110px 54px; padding-left: 0; font-size: 13px; }
.catrow.subrow .name { padding-left: 18px; color: var(--text-2); }
.catrow:hover { background: var(--surface-2); border-radius: 6px; }
.catrow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.catrow .val { text-align: right; font-variant-numeric: tabular-nums; }
.catrow .pct { text-align: right; color: var(--muted); font-size: 12px; }
.track { height: 10px; background: transparent; position: relative; }
.fill { height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); margin: 6px 0 0; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
svg text { fill: var(--text-2); font-size: 11px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; max-width: 280px; }
.tip b { font-variant-numeric: tabular-nums; }
.drill { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.change-up { color: var(--bad); }
.change-down { color: var(--good); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; z-index: 30; display: none; }
.files li { margin: 4px 0; }
.treecat { margin-bottom: 10px; }
.treecat .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 4px 2px 9px; border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
details summary { cursor: pointer; font-weight: 600; margin: 4px 0; }
.note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-2); }
</style>
</head>
<body>
<header><div class="bar"><h1>지출 분석</h1><nav></nav></div></header>
<main></main>
<div class="toast" id="toast"></div>
<script>/* 지출 분석 핵심 로직: 파일 읽기, 합치기, 분류, 분석. 브라우저와 Node(테스트) 양쪽에서 돌아간다. */
(function (root) {
  'use strict';

  // ---------- 기본 분류 (가계부 앱 기본 카테고리와 같은 이름) ----------
  const DEFAULT_TREE = {
    '식비': ['식사', '배달', '편의점', '장보기', '술'],
    '카페·간식': ['카페', '간식·디저트'],
    '교통': ['대중교통', '택시', '주차·주유', '기차·고속버스'],
    '쇼핑': ['의류', '잡화·액세서리', '생활용품', '전자기기', '도서·문구'],
    '구독': ['AI·업무', '영상·음악', '웹소설·웹툰', '멤버십', '앱·클라우드'],
    '여가': ['운동', '굿즈', '게임', '후원·팬활동', '공연·전시', '놀이·모임', '여행'],
    '생활': ['통신', '미용', '건강용품', '택배·우편', '수수료', '반려동물'],
    '의료': ['병원', '약국'],
    '송금': ['친구', '가족', '기타 송금'],
    '기타': ['선물·경조사', '기타'],
  };
  // 지출이 아닌 돈의 이동 (가계부 앱과 같은 값)
  const NOT_SPENDING_CATS = ['카드대금', '현금인출', '입금', '수입', '돌려받은 돈', '내 계좌 이동', '저축'];

  // ---------- 가게 이름 (가계부 앱 Merchants.kt 와 같은 규칙) ----------
  const PAYMENT_AGENTS = [
    '네이버파이낸셜', '네이버페이', '토스페이먼츠', '나이스정보통신', '나이스인프라', 'kcp',
    '이니시스', '다날', '세틀뱅크', '헥토파이낸셜', '한국정보통신', '섹타나인', '갤럭시아',
    '엑심베이', '한국신용카드결제', '구글페이먼트', '코페이', '주식회사카카오',
    '카카오페이', 'alipay', '한국결제네트웍스', 'kg모빌리언스', '페이레터', 'paypal',
  ];
  function displayName(raw) {
    const name = String(raw || '').trim();
    const i = name.lastIndexOf(' - ');
    return i >= 0 && i + 3 < name.length ? name.slice(i + 3).trim() : name;
  }
  function storeKey(raw) {
    let s = displayName(raw).toLowerCase();
    s = s.replace(/^\d{1,2}월/, '');
    s = s.replace(/\s*\d+건$/, '');
    s = s.replace(/,usd:[\d.]+$/, '');
    s = s.replace(/\(주\)|㈜|\( 주 \)|주식회사|유한회사|유한회$|\(유\)|_\d+$/g, '');
    s = s.replace(/[\s_.,·*()\[\]-]/g, '');
    return s;
  }
  function isAgentOnly(raw) {
    const k = storeKey(raw);
    if (!k) return true;
    return PAYMENT_AGENTS.some((a) => k.includes(a));
  }
  // 같은 결제대행사(PG)를 거쳤는지: 카드엔 "이니시스 - 팬딩", 네이버페이엔 "케이지이니시스"처럼 찍힌다
  const PG_ALIASES = [['이니시스'], ['나이스'], ['한국정보통신', 'kicc'], ['kcp'], ['토스페이먼츠'], ['엑심베이'], ['다날'], ['헥토', '세틀뱅크'], ['한국결제네트웍스'], ['kg모빌리언스']];
  function pgOf(raw) {
    const s = String(raw || '').toLowerCase().replace(/\s/g, '');
    const hit = PG_ALIASES.findIndex((al) => al.some((a) => s.includes(a)));
    return hit;
  }
  function samePG(a, b) { const x = pgOf(a); return x >= 0 && x === pgOf(b); }
  // 네이버페이 메모 "스토어 - 판매자이름의 상품명 / 상태:..." 에서 실제 판매자 이름 꺼내기
  function productName(memo) { return String(memo || '').split(' / ')[0].trim(); }
  function sellerFromMemo(memo) {
    const p = productName(memo);
    let m = /^스토어 - (.+?)의 /.exec(p); if (m) return m[1].trim();
    m = /^멤버십 - (\S+)/.exec(p); if (m) return m[1].trim();
    return '';
  }
  function similarStore(a, b) {
    const ka = storeKey(a), kb = storeKey(b);
    if (!ka || !kb) return false;
    return ka === kb || ka.includes(kb) || kb.includes(ka);
  }

  // ---------- 날짜 ----------
  const pad = (n) => String(n).padStart(2, '0');
  function dayNum(date) { // 'YYYY-MM-DD' -> 일 수
    const [y, m, d] = date.split('-').map(Number);
    return Math.round(Date.UTC(y, m - 1, d) / 86400000);
  }
  function minutes(r) {
    if (!r.time) return null;
    const [h, m] = r.time.split(':').map(Number);
    return dayNum(r.date) * 1440 + h * 60 + m;
  }
  function addMonths(ym, n) {
    let [y, m] = ym.split('-').map(Number);
    m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
    return `${y}-${pad(m)}`;
  }
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function weekday(date) { return (dayNum(date) + 4) % 7; } // 1970-01-01 = 목(4)

  // ---------- CSV ----------
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, '');
    const rows = []; let row = []; let f = ''; let q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(f); f = ''; if (row.some((x) => x !== '')) rows.push(row); row = [];
      } else f += c;
    }
    row.push(f); if (row.some((x) => x !== '')) rows.push(row);
    return rows;
  }
  // 수입 기록 뒤로 붙은 열 (없으면 빈칸): 종류 = 결제/환불/출금/입금, 상계대상 = 연결된 결제 id, 귀속월 = YYYY-MM
  const EXTRA_COLS = ['종류', '상계대상', '귀속월'];
  const CSV_COLS = ['id', '날짜', '시각', '금액', '가게명', '원래가게명', '카테고리', '결제수단', '할부', '송금여부', '지출포함여부', '취소됨', '메모', '출처'];
  function toInt(s) {
    const n = parseInt(String(s || '').replace(/[,\s원]/g, ''), 10);
    return Number.isFinite(n) ? n : null;
  }
  function parseAppCSV(text) { return parseAppRows(parseCSV(text)); }
  /** 첫 줄이 열 이름인 2차원 배열 (CSV 또는 구글 시트 '내역') */
  function parseAppRows(rows) {
    rows = rows.map((r) => r.map((v) => String(v == null ? '' : v)));
    if (!rows.length) throw new Error('빈 파일이에요');
    const head = rows[0].map((h) => h.trim());
    const idx = {};
    CSV_COLS.concat(EXTRA_COLS).forEach((c) => { idx[c] = head.indexOf(c); });
    if (idx['날짜'] < 0 || idx['금액'] < 0) throw new Error('가계부 CSV 형식이 아니에요 (날짜·금액 열이 없음)');
    const get = (r, c) => (idx[c] >= 0 ? (r[idx[c]] || '').trim() : '');
    const out = [];
    const problems = [];
    rows.slice(1).forEach((r, n) => {
      const amount = toInt(get(r, '금액'));
      const date = get(r, '날짜');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { problems.push(`${n + 2}번째 줄: 날짜를 읽지 못함`); return; }
      if (amount === null) problems.push(`${n + 2}번째 줄 (${date} ${get(r, '가게명')}): 금액이 비어 있어 0원으로 둠`);
      // 가게 칸에 결제대행사 이름만 있으면 메모의 판매자 이름을 가게로 쓴다
      let store = get(r, '가게명') || get(r, '원래가게명');
      const seller = isAgentOnly(store) ? sellerFromMemo(get(r, '메모')) : '';
      if (seller) store = seller;
      out.push({
        id: get(r, 'id') || `csv-${date}-${n}`,
        date, time: get(r, '시각'),
        amount: amount || 0,
        store,
        rawStore: get(r, '원래가게명') || get(r, '가게명'),
        cat: get(r, '카테고리'),
        pay: get(r, '결제수단'),
        inst: toInt(get(r, '할부')) || 0,
        transfer: get(r, '송금여부') === 'Y',
        include: get(r, '지출포함여부') !== 'N',
        canceled: get(r, '취소됨') === 'Y',
        memo: get(r, '메모'),
        source: get(r, '출처') || 'CSV',
        kind: get(r, '종류'), offsetTo: get(r, '상계대상'), incomeYM: get(r, '귀속월'),
      });
    });
    return { rows: out, problems };
  }

  // ---------- 현대카드 .xls (실제는 HTML 표) ----------
  function htmlText(s) {
    return String(s).replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d))
      .replace(/\s+/g, ' ').trim();
  }
  function htmlRows(html) {
    const rows = [];
    const trs = String(html).match(/<tr[\s\S]*?<\/tr\s*>/gi) || [];
    for (const tr of trs) {
      const cells = [];
      const re = /<t[dh][^>]*>([\s\S]*?)<\/t[dh]\s*>/gi; let m;
      while ((m = re.exec(tr))) cells.push(htmlText(m[1]));
      rows.push(cells);
    }
    return rows;
  }
  const KDATE = /(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/;
  function kdate(s) { const m = KDATE.exec(s || ''); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : null; }

  function detectHyundai(html) {
    const t = htmlText(String(html).slice(0, 4000));
    if (/이용대금명세서/.test(t)) return 'statement';
    if (/실시간 이용내역/.test(t) || /승인번호/.test(t)) return 'realtime';
    return null;
  }

  function parseHyundaiStatement(html) {
    const t = htmlText(String(html).slice(0, 3000));
    const mm = /(\d{4})년\s*(\d{2})월\s*이용대금명세서(\(예정\))?/.exec(t);
    const label = mm ? `${mm[1]}-${mm[2]}${mm[3] ? ' 예정' : ''}` : '';
    const out = []; const seen = {};
    let overseas = false;
    for (const c of htmlRows(html)) {
      if (c.length >= 3 && /해\s*외/.test(c[2]) && /소계/.test(c[2])) continue;
      const date = kdate(c[0]);
      if (!date || c.length < 4) continue;
      let raw = c[2];
      const amount = toInt(c[3]);
      if (amount === null) continue;
      let memo = '';
      const usd = /^(.*?),\s*([A-Z]{3}):([\d.]+)$/.exec(raw);
      if (usd) { raw = usd[1].trim(); memo = `해외 ${usd[2]} ${usd[3]}`; overseas = true; }
      const bus = /^(\d{1,2})월(.+?)\s+0*(\d+)건$/.exec(raw);
      if (bus) { raw = bus[2].trim(); memo = `${bus[1]}월 ${+bus[3]}건 합산`; }
      let inst = 0;
      const im = /(\d+)\s*\/\s*(\d+)/.exec(c[4] || '');
      if (im) { inst = +im[1]; memo = (memo ? memo + ' / ' : '') + `할부 ${im[2]}회차`; }
      const base = `hd-${date}-${storeKey(raw)}-${amount}`;
      seen[base] = (seen[base] || 0) + 1;
      out.push({
        id: `${base}-${seen[base]}`, date, time: '', amount,
        store: displayName(raw), rawStore: raw, cat: '', pay: '현대카드', inst,
        transfer: false, include: !/가승인/.test(raw), canceled: false,
        memo, source: '카드 파일(명세서)',
      });
    }
    return { rows: out, label, problems: [] };
  }

  function parseHyundaiRealtime(html) {
    const out = [];
    for (const c of htmlRows(html)) {
      if (c.length < 11) continue;
      const date = kdate(c[0]);
      if (!date) continue;
      const amount = toInt(c[5]);
      if (amount === null) continue;
      const raw = c[4];
      const canceled = (c[9] && c[9] !== '-') || /취소/.test(c[10]);
      out.push({
        id: `hdrt-${c[8]}-${date}`, date, time: c[1], amount,
        store: displayName(raw), rawStore: raw, cat: '', pay: '현대카드',
        inst: toInt(c[7]) || 0, transfer: false,
        include: !/가승인/.test(raw), canceled,
        memo: /가승인/.test(raw) ? '가승인 (실제 결제가 따로 있음)' : '',
        source: '카드 파일(실시간)', approval: c[8],
      });
    }
    const dates = out.map((r) => r.date).sort();
    return { rows: out, label: dates.length ? `${dates[0]} ~ ${dates[dates.length - 1]}` : '', problems: [] };
  }

  /** 파일 하나를 읽어 {kind, label, rows, problems} 로. key 가 같은 파일은 다시 올리면 교체된다. */
  function parseFile(name, text) {
    const head = String(text).slice(0, 4000);
    if (/<t[dr][\s>]/i.test(head) || /<table/i.test(head) || /<html/i.test(head)) {
      const kind = detectHyundai(text);
      if (kind === 'statement') {
        const p = parseHyundaiStatement(text);
        return { kind: '현대카드 명세서', key: `stmt:${p.label}`, name, ...p };
      }
      if (kind === 'realtime') {
        const p = parseHyundaiRealtime(text);
        return { kind: '현대카드 실시간 내역', key: `rt:${p.label}`, name, ...p };
      }
      throw new Error('현대카드 명세서·이용내역 형식이 아니에요');
    }
    const p = parseAppCSV(text);
    const srcs = [...new Set(p.rows.map((r) => r.source))];
    const isNaver = srcs.length === 1 && /네이버페이내역/.test(srcs[0]);
    return {
      kind: isNaver ? '네이버페이 내역' : '가계부 CSV',
      key: isNaver ? 'naverpay' : 'app',
      name, label: rangeLabel(p.rows), ...p,
    };
  }
  function rangeLabel(rows) {
    const d = rows.map((r) => r.date).sort();
    return d.length ? `${d[0]} ~ ${d[d.length - 1]}` : '';
  }

  // ---------- 여러 파일 합치기 ----------
  const isCardFile = (r) => /^카드 파일/.test(r.source);
  const isNaverpay = (r) => r.pay === '네이버페이' || /네이버페이/.test(r.source);
  const isNaverCard = (r) => r.pay === '현대카드' && /네이버/.test(r.rawStore);

  /**
   * files: [{key, rows}] → {rows, report}
   * 1) 같은 id 는 한 건 (명세서끼리 겹치는 할부 등)
   * 2) 명세서 ↔ 실시간 내역 겹치는 결제는 실시간 쪽 하나로 (시각이 있어서)
   * 3) 카드의 '네이버파이낸셜' 결제 ↔ 네이버페이 내역을 짝지어 한 건 (가게명은 네이버페이 쪽)
   */
  function combine(files) {
    const report = { sameId: 0, stmtVsRt: [], naverMatched: 0, naverPointMix: [], naverViaPG: [], naverShipping: [], naverZeroFilled: [], naverCardUnmatched: [], naverpayOnly: 0 };
    const byId = new Map();
    for (const f of files) for (const r of f.rows) {
      if (byId.has(r.id)) { report.sameId++; continue; }
      byId.set(r.id, { ...r });
    }
    let rows = [...byId.values()];

    // 2) 명세서 vs 실시간
    const rt = rows.filter((r) => r.source === '카드 파일(실시간)');
    if (rt.length) {
      const rtFrom = rt.map((r) => r.date).sort()[0];
      const used = new Set();
      const drop = new Set();
      for (const s of rows.filter((r) => r.source === '카드 파일(명세서)' && dayNum(r.date) >= dayNum(rtFrom) - 1)) {
        const cand = rt.filter((r) => !used.has(r.id) && Math.abs(dayNum(r.date) - dayNum(s.date)) <= 1 && r.amount === s.amount &&
          (similarStore(r.rawStore, s.rawStore) || (isAgentOnly(r.rawStore) && isAgentOnly(s.rawStore))));
        let hit = cand[0];
        if (!hit) { // 이름이 다르게 찍혀도(택시 등) 같은 카드·같은 날·같은 금액이 하나뿐이면 같은 결제
          const loose = rt.filter((r) => !used.has(r.id) && Math.abs(dayNum(r.date) - dayNum(s.date)) <= 1 && r.amount === s.amount);
          if (loose.length === 1) hit = loose[0];
        }
        if (!hit) { // 해외결제: 승인액과 청구액이 다름
          hit = rt.find((r) => !used.has(r.id) && similarStore(r.rawStore, s.rawStore) && Math.abs(dayNum(r.date) - dayNum(s.date)) <= 3 &&
            Math.abs(r.amount - s.amount) <= Math.max(r.amount, s.amount) * 0.1);
          if (hit) report.stmtVsRt.push({ store: s.store, date: s.date, approved: hit.amount, billed: s.amount });
          if (hit) { hit.memo = [hit.memo, `승인 ${hit.amount.toLocaleString()}원 → 청구 ${s.amount.toLocaleString()}원`].filter(Boolean).join(' / '); hit.amount = s.amount; }
        }
        if (hit) { used.add(hit.id); drop.add(s.id); }
      }
      rows = rows.filter((r) => !drop.has(r.id));
      report.stmtRtMerged = drop.size;
    }

    // 3) 카드 네이버 결제 ↔ 네이버페이 내역
    const np = rows.filter((r) => isNaverpay(r) && !isCardFile(r));
    const cards = rows.filter((r) => isCardFile(r) && isNaverCard(r));
    if (np.length && rows.some(isCardFile)) {
      const npFrom = np.map((r) => r.date).sort()[0];
      const npTo = np.map((r) => r.date).sort().slice(-1)[0];
      const used = new Set(); const drop = new Set();
      // 1차: 카드에 '네이버'로 찍힌 결제. 2차: 네이버페이로 냈지만 카드엔 PG·가게 이름으로 찍힌 결제
      const pass = (cardList, strict) => {
        const sorted = cardList.filter((c) => !drop.has(c.id)).sort((a, b) => (b.time ? 1 : 0) - (a.time ? 1 : 0));
        for (const c of sorted) {
          let best = null; let bestD = Infinity;
          for (const n of np) {
            if (used.has(n.id) || n.amount !== c.amount) continue;
            let d;
            if (c.time && n.time) { d = Math.abs(minutes(c) - minutes(n)); if (d > 10) continue; }
            else {
              d = Math.abs(dayNum(c.date) - dayNum(n.date)) * 1440; if (d > 1440) continue;
              if (strict && !(samePG(c.rawStore, n.rawStore) || similarStore(c.store, n.store) || similarStore(c.rawStore, n.rawStore))) continue;
            }
            if (d < bestD) { bestD = d; best = n; }
          }
          if (!best && c.time && !strict) { // 포인트+카드 나눠 낸 결제: 네이버페이 금액이 더 크고 몇 분 안
            for (const n of np) {
              if (used.has(n.id) || !n.time || n.amount <= c.amount) continue;
              const d = Math.abs(minutes(c) - minutes(n));
              if (d <= 3 && d < bestD) { bestD = d; best = n; }
            }
            if (best) report.naverPointMix.push({ date: best.date, store: best.store, total: best.amount, card: c.amount });
          }
          if (best) {
            used.add(best.id); drop.add(c.id);
            best.pay = '현대카드(네이버페이)';
            best.matchedCard = c.id;
            best.cardStore = c.rawStore;
            if (strict) report.naverViaPG.push({ date: best.date, store: best.store, card: c.rawStore, amount: c.amount });
            if (best.amount !== c.amount) { best.memo = [best.memo, `카드 ${c.amount.toLocaleString()}원 + 포인트 ${(best.amount - c.amount).toLocaleString()}원`].filter(Boolean).join(' / '); best.amount = c.amount; }
          }
        }
      };
      pass(cards, false);
      pass(rows.filter((r) => isCardFile(r) && !isNaverCard(r) && r.amount > 0 && r.date >= npFrom && r.date <= npTo), true);
      // 3차: 네이버페이 내역 금액엔 배송비가 빠져 있고, 한 주문이 상품별로 나뉘어 있다.
      // 카드 금액 = 같은 날 같은 가게 상품 합계 + 배송비(5천원 이하) 이면 한 주문으로 본다.
      for (const c of cards) {
        if (drop.has(c.id)) continue;
        const cand = np.filter((n) => !used.has(n.id) && !n.canceled && n.date === c.date);
        let hit = null;
        for (const [, g] of group(cand, (n) => `${n.date}|${storeKey(n.store)}`)) {
          const total = sum(g.map((n) => n.amount));
          const diff = c.amount - total;
          if (diff >= 0 && diff <= 5000 && (!hit || Math.abs(diff) < Math.abs(hit.diff))) hit = { g, diff, total };
        }
        if (!hit) continue;
        drop.add(c.id);
        hit.g.forEach((n) => { used.add(n.id); n.pay = '현대카드(네이버페이)'; n.matchedCard = c.id; n.cardStore = c.rawStore; });
        if (hit.diff > 0) {
          const first = hit.g[0];
          first.amount += hit.diff;
          first.memo = [first.memo, `배송비 등 ${hit.diff.toLocaleString()}원 포함 (카드 ${c.amount.toLocaleString()}원)`].filter(Boolean).join(' / ');
        }
        report.naverShipping.push({ date: c.date, store: hit.g[0].store, items: hit.g.length, goods: hit.total, card: c.amount });
      }
      // 4차: 시각 없는 명세서 건. 같은 날 네이버페이 쪽이 금액 0원(금액 누락)이거나 카드보다 크면(포인트 일부 사용) 짝.
      for (const c of cards) {
        if (drop.has(c.id)) continue;
        const cand = np.filter((n) => !used.has(n.id) && !n.canceled && n.date === c.date && (n.amount === 0 || n.amount > c.amount));
        if (cand.length !== 1) continue;
        const n = cand[0];
        drop.add(c.id); used.add(n.id);
        n.pay = '현대카드(네이버페이)'; n.matchedCard = c.id; n.cardStore = c.rawStore;
        if (n.amount === 0) { n.memo = [n.memo, `금액이 비어 있어 카드 금액 ${c.amount.toLocaleString()}원 사용`].filter(Boolean).join(' / '); n.amount = c.amount; report.naverZeroFilled.push({ date: n.date, store: n.store, card: c.amount }); }
        else { report.naverPointMix.push({ date: n.date, store: n.store, total: n.amount, card: c.amount }); n.memo = [n.memo, `카드 ${c.amount.toLocaleString()}원 + 포인트 ${(n.amount - c.amount).toLocaleString()}원`].filter(Boolean).join(' / '); n.amount = c.amount; }
      }
      for (const c of cards) if (!drop.has(c.id) && c.date >= npFrom && c.date <= npTo) report.naverCardUnmatched.push(c);
      rows = rows.filter((r) => !drop.has(r.id));
      report.naverMatched = drop.size;
      report.naverpayOnly = np.filter((n) => !used.has(n.id)).length;
    }
    // 4) 카드 환불(음수)인데 원래 결제가 이미 '취소됨'으로 처리돼 있으면 두 번 빼지 않게 환불 줄은 지출에서 제외
    report.refundOfCanceled = [];
    for (const r of rows) {
      if (r.amount >= 0 || !r.include) continue;
      const orig = rows.find((x) => x.canceled && x.amount === -r.amount && dayNum(r.date) - dayNum(x.date) >= 0 && dayNum(r.date) - dayNum(x.date) <= 31 &&
        (similarStore(x.rawStore, r.rawStore) || samePG(x.rawStore, r.rawStore) || (x.cardStore && similarStore(x.cardStore, r.rawStore)) || pgOf(x.store) >= 0 && pgOf(x.store) === pgOf(r.rawStore)));
      if (orig) {
        r.include = false;
        r.memo = [r.memo, '원래 결제가 이미 취소로 처리돼 있어 환불 줄은 지출에서 뺌'].filter(Boolean).join(' / ');
        report.refundOfCanceled.push({ date: r.date, store: r.store, amount: r.amount });
      }
    }
    // 5) 상계: 환불·입금이 가리키는 결제는 그만큼 줄여서 센다 (행은 그대로 둔다)
    applyOffsets(rows);
    rows.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    return { rows, report };
  }

  // ---------- 분류 ----------
  /**
   * state: {memory: {storeKey: {cat, sub}}, overrides: {id: {cat, sub}}}
   * 결제대행사 이름만 있는 가게는 기억하지 않고 건별(overrides)로만.
   */
  function classify(r, state) {
    const ov = state.overrides[r.id];
    const agent = isAgentOnly(r.store);
    const k = storeKey(r.store);
    let mem = agent ? null : state.memory[k];
    if (!mem && agent) { const sk = storeKey(sellerFromMemo(r.memo)); if (sk) mem = state.memory[sk] || null; }
    // 단어 규칙이 가게 기억보다 먼저 (같은 가게라도 상품명이 다르면 다르게: 가계부 앱과 같은 순서)
    const rule = !(ov && ov.cat) ? matchRule(r, state.rules) : null;
    let cat = (ov && ov.cat) || r.cat || (rule && rule.cat) || (mem && mem.cat) || '';
    let sub = '';
    if (ov && ov.sub && (!ov.cat || ov.cat === cat)) sub = ov.sub;
    else if (rule && rule.sub && rule.cat === cat) sub = rule.sub;
    else if (mem && mem.sub && mem.cat === cat) sub = mem.sub;
    return { cat, sub, agent, key: k, byRule: !!(rule && rule.cat === cat && !(ov && ov.cat)) };
  }

  function matchRule(r, rules) {
    if (!rules || !rules.length) return null;
    const text = `${r.store} ${productName(r.memo)}`.toLowerCase().replace(/\s/g, '');
    return rules.find((x) => x.kw && text.includes(String(x.kw).toLowerCase().replace(/\s/g, ''))) || null;
  }

  /** 합계에 넣을 금액. 취소·지출 아님·지출 제외는 0. 송금 제외 옵션. */
  function applyOffsets(rows) {
    const byId = new Map(rows.map((r) => [r.id, r]));
    for (const r of rows) delete r.offset;
    for (const r of rows) {
      if (!r.offsetTo || r.canceled) continue;
      const t = byId.get(r.offsetTo);
      if (t) t.offset = (t.offset || 0) + Math.abs(r.amount);
    }
  }
  /** 상계를 뺀 결제 금액 (0 아래로 안 내려감) */
  function netAmount(r) {
    return r.amount > 0 && r.offset ? Math.max(0, r.amount - r.offset) : r.amount;
  }
  function spendAmount(r, opts) {
    if (r.canceled || !r.include) return 0;
    if (r.offsetTo) return 0; // 결제에 연결된 환불·입금은 결제 쪽에서 이미 뺐다
    if (NOT_SPENDING_CATS.includes(r.cat)) return 0;
    if (opts && opts.excludeTransfer && (r.transfer || r.cat === '송금')) return 0;
    return netAmount(r);
  }

  // ---------- 할부 ----------
  /** 첫 회차 = 결제 다음 달 (가계부 앱과 같음) */
  function installment(r, todayYM) {
    if (!r.inst || r.inst < 2) return null;
    const monthly = Math.round(r.amount / r.inst);
    const first = addMonths(r.date.slice(0, 7), 1);
    let paid = 0;
    for (let i = 0; i < r.inst; i++) if (addMonths(first, i) <= todayYM) paid++;
    const left = r.inst - paid;
    return { months: r.inst, monthly, left, leftAmount: r.amount - monthly * paid };
  }

  // ---------- 분석 ----------
  function group(items, keyFn) {
    const m = new Map();
    for (const it of items) { const k = keyFn(it); if (!m.has(k)) m.set(k, []); m.get(k).push(it); }
    return m;
  }
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const median = (a) => { const s = a.slice().sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; };

  /**
   * 고정 지출: 같은 가게(대행사면 가게+금액)에서 서로 다른 3개월 이상,
   * 금액이 중앙값 ±15% 이내, 간격이 대체로 한 달(25~35일)인 결제.
   */
  function findRecurring(items, todayDate) {
    // 정기구독은 같은 가게(CHZZK 등)에서 상품별로 따로 나가니 상품명까지 묶는다
    const product = (x) => { const p = String(x.r.memo || '').split(' / ')[0]; return /정기구독|정기결제|월간 이용권|멤버십/.test(p) ? p : ''; };
    const keyFn = (x) => (product(x) ? `${x.c.key}|${product(x)}` : x.c.agent ? `${x.c.key}|${x.r.amount}` : x.c.key);
    const res = [];
    for (const [, list] of group(items.filter((x) => x.amt > 0), keyFn)) {
      if (list.length < 3) continue;
      const med = median(list.map((x) => x.amt));
      const close = list.filter((x) => Math.abs(x.amt - med) <= med * 0.15);
      // 한 달에 한 건씩만 (같은 달 여러 번이면 습관이지 고정은 아님)
      const byMonth = group(close, (x) => x.r.date.slice(0, 7));
      if (byMonth.size < 3) continue;
      if ([...byMonth.values()].filter((v) => v.length > 1).length > byMonth.size / 3) continue;
      const firsts = [...byMonth.values()].map((v) => v[0]).sort((a, b) => a.r.date.localeCompare(b.r.date));
      const gaps = [];
      for (let i = 1; i < firsts.length; i++) gaps.push(dayNum(firsts[i].r.date) - dayNum(firsts[i - 1].r.date));
      const monthly = gaps.filter((g) => g >= 25 && g <= 35).length;
      if (monthly < Math.max(2, gaps.length * 0.6)) continue;
      const last = firsts[firsts.length - 1];
      const nextDay = dayNum(last.r.date) + 30;
      const active = todayDate ? dayNum(todayDate) - dayNum(last.r.date) <= 40 : true;
      res.push({
        store: product(last) ? `${last.r.store} · ${product(last)}` : last.r.store, cat: last.c.cat, sub: last.c.sub, agent: last.c.agent,
        amount: Math.round(med), count: firsts.length,
        from: firsts[0].r.date, last: last.r.date, active,
        nextDay, day: +last.r.date.slice(8, 10),
        ids: close.map((x) => x.r.id),
      });
    }
    return res.sort((a, b) => (b.active - a.active) || b.amount - a.amount);
  }

  /** 중복 의심: 같은 금액, 다른 id, 시각 10분 이내(또는 시각 없는 경우 같은 날 + 비슷한 가게) */
  function findDuplicates(rows) {
    const res = [];
    const live = rows.filter((r) => !r.canceled && r.include && r.amount > 0);
    const byAmt = group(live, (r) => r.amount);
    for (const [, list] of byAmt) {
      if (list.length < 2) continue;
      list.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));

    for (let v = 0; v <= top + 1; v += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${man(v)}</text>`;
    months.forEach((m, i) => {
      const cx = L + ((W - L) / months.length) * (i + 0.5);
      let acc = 0;
      const segs = series.map((s) => ({ s, v: Math.max(0, valueOf(s, m)) })).filter((o) => o.v > 0);
      segs.forEach((o, j) => {
        const y0 = y(acc), y1 = y(acc + o.v); acc += o.v;
        const h = Math.max(0, y0 - y1 - (j < segs.length - 1 ? 2 : 0));
        const isTop = j === segs.length - 1;
        const tipH = `<b>${m}</b><br>${esc(labelOf(o.s))}: <b>${won(o.v)}</b><br><span class="muted">월 합계 ${won(totals[i])}</span>`;
        g += isTop
          ? `<path d="${roundTop(cx - bw / 2, y1, bw, h)}" fill="${colorOf(o.s)}" data-tip="${esc(tipH)}" data-m="${m}"/>`
          : `<rect x="${cx - bw / 2}" y="${y1 + (j < segs.length - 1 ? 0 : 0)}" width="${bw}" height="${h}" fill="${colorOf(o.s)}" data-tip="${esc(tipH)}" data-m="${m}"/>`;
      });
      const lbl = months.length > 14 ? (i % 2 ? '' : m.slice(2).replace('-', '.')) : m.slice(2).replace('-', '.');
      g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${lbl}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="월별 지출">${g}</svg>`;
  }
  function roundTop(x, y, w, h) {
    const r = Math.min(4, h, w / 2);
    return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
  }
  function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function hbars(rows, color) { // [{label, value, sub, tip}]
    const max = Math.max(1, ...rows.map((r) => r.value));
    return rows.map((r) => `<div class="catrow" data-tip="${esc(r.tip || '')}" ${r.attr || ''}>
      <div class="name">${esc(r.label)}</div><div class="track"><div class="fill" style="width:${(r.value / max) * 100}%;background:${r.color || color}"></div></div>
      <div class="val">${r.valText || won(r.value)}</div><div class="pct">${r.sub || ''}</div></div>`).join('');
  }

  // ---------- 수입·저축·남은 돈 ----------
  const FLOW = { income: ['수입', 'var(--s3)'], saving: ['저축', 'var(--s1)'], spend: ['지출', 'var(--s2)'] };
  function groupedColumns(months, keys, val, note) {
    const W = 760, H = 250, L = 46, B = 26, T = 22;
    const max = Math.max(1, ...months.flatMap((m) => keys.map((k) => val(k, m) || 0)));
    const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const slot = (W - L) / months.length;
    const bw = Math.min(16, (slot * 0.7) / keys.length);
    let g = '';
    for (let v = 0; v <= top + 1; v += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${man(v)}</text>`;
    months.forEach((m, i) => {
      const cx = L + slot * (i + 0.5);
      const ks = keys.filter((k) => val(k, m) != null);
      ks.forEach((k, j) => {
        const v = Math.max(0, val(k, m)); const x = cx - (ks.length * bw) / 2 + j * bw;
        const tipH = `<b>${m}</b><br>${FLOW[k][0]}: <b>${won(v)}</b>${note(m) ? `<br>${note(m).tip}` : ''}`;
        if (v > 0) g += `<path d="${roundTop(x + 1, y(v), bw - 2, y(0) - y(v))}" fill="${FLOW[k][1]}" data-tip="${esc(tipH)}"/>`;
      });
      const n = note(m);
      if (n) g += `<text x="${cx}" y="${T - 8}" text-anchor="middle" style="fill:${n.v < 0 ? 'var(--bad)' : 'var(--good)'};font-weight:600">${n.v < 0 ? '−' : '+'}${man(Math.abs(n.v))}</text>`;
      const lbl = months.length > 14 ? (i % 2 ? '' : m.slice(2).replace('-', '.')) : m.slice(2).replace('-', '.');
      g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${lbl}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="월별 수입·저축·지출">${g}</svg>`;
  }
  function flowCards(months, recurring) {
    const flow = C.monthFlow(D.rows);
    if (!flow.start) {
      return `<div class="card"><h2>수입 · 저축 · 남은 돈</h2><p class="muted" style="margin:0">아직 수입 기록이 없어요. 가계부 앱에서 입금을 '수입'으로, 적금을 '저축'으로 고르면 여기 달마다 쓸 수 있는 돈과 남은 돈이 나와요.</p></div>`;
    }
    const spendOf = (m) => C.sum(D.items.filter((x) => x.ym === m).map((x) => x.amt));
    const fixedIds = new Set(recurring.flatMap((f) => f.ids));
    const fixedOf = (m) => C.sum(D.items.filter((x) => x.ym === m && x.amt > 0 && fixedIds.has(x.r.id)).map((x) => x.amt));
    const rec = (m) => {
      const f = flow.byMonth[m] || { income: 0, saving: 0 };
      const has = m >= flow.start;
      const spend = spendOf(m);
      const avail = f.income - f.saving;
      return { m, has, income: f.income, saving: f.saving, spend, avail, left: avail - spend, fixed: fixedOf(m), rate: f.income ? f.saving / f.income : 0, now: m === thisYM };
    };
    const all = months.map(rec);
    const withIncome = all.filter((o) => o.has);
    // 1) 월별 막대
    const chart = groupedColumns(months, ['income', 'saving', 'spend'], (k, m) => {
      const o = all.find((x) => x.m === m);
      if (k !== 'spend' && !o.has) return null;
      return o[k];
    }, (m) => { const o = all.find((x) => x.m === m); return o.has ? { v: o.left, tip: `남은 돈 <b>${won(o.left)}</b>${o.now ? ' (진행 중)' : ''}` } : null; });
    const legend = ['income', 'saving', 'spend'].map((k) => `<span><i class="dot" style="background:${FLOW[k][1]}"></i>${FLOW[k][0]}</span>`).join('') + '<span>막대 위 숫자 = 남은 돈 (수입 − 저축 − 지출)</span>';
    // 2) 성적표
    const rows = withIncome.slice().reverse().map((o) => `<tr>
      <td>${o.m}${o.now ? ' <span class="pill">진행 중</span>' : ''}</td><td class="num">${won(o.income)}</td><td class="num">${won(o.saving)}</td>
      <td class="num">${won(o.avail)}</td><td class="num">${won(o.spend)}</td>
      <td class="num ${o.left < 0 ? 'change-up' : 'change-down'}" style="font-weight:600">${o.left < 0 ? `▲ ${won(-o.left)} 넘김` : `${won(o.left)} 남김`}</td>
      <td class="num">${o.income ? `${Math.round(o.rate * 100)}%` : '-'}</td></tr>`).join('');
    const done = withIncome.filter((o) => !o.now);
    const over = done.filter((o) => o.left < 0).length;
    // 3) 쓸 수 있는 돈의 구성
    const recent = withIncome.slice(-6).reverse();
    const comp = recent.map((o) => {
      const fixed = Math.min(o.fixed, o.spend); const free = o.spend - fixed;
      const base = Math.max(o.avail, 1);
      const w = (v) => `${Math.min(100, (Math.max(0, v) / base) * 100)}%`;
      const freeIn = Math.max(0, Math.min(free, o.avail - fixed));
      const tip = `<b>${o.m}</b><br>쓸 수 있는 돈 ${won(o.avail)}<br>고정 지출 ${won(fixed)} · 자유 지출 ${won(free)}<br>${o.left < 0 ? `넘김 ${won(-o.left)}` : `남음 ${won(o.left)}`}`;
      return `<div class="catrow" data-tip="${esc(tip)}"><div class="name">${o.m}${o.now ? ' · 진행 중' : ''}</div>
        <div class="track" style="display:flex;background:var(--surface-2);border-radius:4px;overflow:hidden;${o.left < 0 ? 'box-shadow:inset 0 0 0 2px var(--bad)' : ''}">
          <div style="height:10px;width:${w(fixed)};background:var(--s7)"></div>
          <div style="height:10px;width:${w(o.left < 0 ? o.avail - fixed : freeIn)};background:${o.left < 0 ? 'var(--bad)' : 'var(--s2)'}"></div>
        </div><div class="val">${o.left < 0 ? `<span class="change-up">${man(-o.left)} 넘김</span>` : `${man(o.left)} 남음`}</div><div class="pct">${o.avail > 0 ? `${Math.round((fixed / o.avail) * 100)}%` : ''}</div></div>`;
    }).join('');
    const last = done.slice(-1)[0] || withIncome.slice(-1)[0];
    const sentence = last && last.avail > 0
      ? `${last.m}엔 쓸 수 있는 돈 ${won(last.avail)} 중 고정 지출이 ${won(last.fixed)}(${Math.round((last.fixed / last.avail) * 100)}%)를 먼저 차지해서, 자유롭게 쓸 수 있는 돈은 ${won(last.avail - last.fixed)}였어요.`
      : '';
    return `
      <div class="card"><h2>수입 · 저축 · 지출</h2><p class="sub">수입은 귀속월(기준일 이후 받은 돈은 다음 달) 기준이에요. 수입 기록은 ${flow.start}부터 있어서, 그 전 달은 지출만 보여요.</p>
        ${chart}<div class="legend">${legend}</div></div>
      <div class="grid2" style="margin-bottom:16px">
        <div class="card"><h2>달별 성적표</h2><p class="sub">쓸 수 있는 돈 = 수입 − 저축. ${done.length ? `끝난 ${done.length}달 중 ${over ? `<b class="change-up">${over}달 넘김</b>` : '넘긴 달 없음'}.` : ''}</p>
          ${withIncome.length ? `<div class="tablewrap"><table><thead><tr><th>달</th><th class="num">수입</th><th class="num">저축</th><th class="num">쓸 수 있는 돈</th><th class="num">지출</th><th class="num">결과</th><th class="num">저축률</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">이 기간엔 수입 기록이 없어요.</p>'}</div>
        <div class="card"><h2>쓸 수 있는 돈의 구성</h2><p class="sub">막대 전체 = 그달 쓸 수 있는 돈, 회색 = 남은 돈. 오른쪽 %는 고정 지출이 차지한 몫이에요.</p>
          <div class="legend" style="margin:0 0 8px"><span><i class="dot" style="background:var(--s7)"></i>고정 지출</span><span><i class="dot" style="background:var(--s2)"></i>자유 지출</span><span><i class="dot" style="background:var(--bad)"></i>다 쓰고 넘친 달</span></div>
          ${comp || '<p class="muted">이 기간엔 수입 기록이 없어요.</p>'}${sentence ? `<p class="note" style="margin-top:10px">${sentence}</p>` : ''}</div>
      </div>`;
  }

  // ---------- 대시보드 ----------
  function viewDash() {
    const items = D.items.filter(inRange);
    const spend = items.filter((x) => x.amt !== 0); // 환불(음수)도 합계에 반영
    const total = C.sum(spend.map((x) => x.amt));
    const months = monthsIn();
    const mCount = Math.max(1, months.filter((m) => m <= thisYM).length);
    const recurring = C.findRecurring(D.items.map((x) => ({ r: x.r, c: { ...x.c, cat: x.cat }, amt: x.amt })), todayStr);
    const activeFixed = recurring.filter((r) => r.active);
    const uncat = spend.filter((x) => x.cat === UNCAT && x.amt > 0);
    const nosub = spend.filter((x) => x.cat !== UNCAT && !x.c.sub && x.amt > 0);

    // 세부 분류
    const byCat = [...C.group(spend, (x) => x.cat)].map(([cat, l]) => ({ cat, l, v: C.sum(l.map((x) => x.amt)) })).sort((a, b) => b.v - a.v);
    let catHtml = '';
    for (const { cat, l, v } of byCat) {
      const open = UI.openCat === cat;
      catHtml += `<div class="catrow" data-cat="${esc(cat)}" data-tip="${esc(`<b>${cat}</b> ${won(v)} · ${l.length}건<br>눌러서 세부 분류 펼치기`)}">
        <div class="name"><span class="dot" style="background:${catColor(cat)}"></span>${open ? '▾' : '▸'} ${esc(cat)}</div>
        <div class="track"><div class="fill" style="width:${(v / (byCat[0].v || 1)) * 100}%;background:${catColor(cat)}"></div></div>
        <div class="val">${won(v)}</div><div class="pct">${total ? Math.round((v / total) * 100) : 0}%</div></div>`;
      if (open) {
        const subs = [...C.group(l, (x) => x.sub)].map(([sub, sl]) => ({ sub, sl, v: C.sum(sl.map((x) => x.amt)) })).sort((a, b) => b.v - a.v);
        for (const s of subs) {
          catHtml += `<div class="catrow subrow" data-drill="${esc(`sub|${cat}|${s.sub}`)}" data-tip="${esc(`<b>${cat} · ${s.sub}</b><br>${won(s.v)} · ${s.sl.length}건 · 월평균 ${won(s.v / mCount)}<br>눌러서 내역 보기`)}">
            <div class="name">${esc(s.sub)}</div>
            <div class="track"><div class="fill" style="width:${(s.v / (subs[0].v || 1)) * 100}%;background:${catColor(cat)};opacity:.65"></div></div>
            <div class="val">${won(s.v)}</div><div class="pct">${s.sl.length}건</div></div>`;
        }
      }
    }

    // 추세
    const trendCats = byCat.map((o) => o.cat);
    let series, valueOf, colorOf, labelOf, legend;
    const sel = UI.trendCat;
    if (sel && trendCats.includes(sel)) {
      const l = spend.filter((x) => x.cat === sel);
      const subs = [...C.group(l, (x) => x.sub)].map(([s, sl]) => ({ s, v: C.sum(sl.map((x) => x.amt)) })).sort((a, b) => b.v - a.v).map((o) => o.s);
      const top = subs.slice(0, 7); const rest = subs.slice(7);
      series = rest.length ? [...top, '그 외'] : top;
      const subColor = (s) => (s === '그 외' ? 'var(--s-other)' : `var(--s${(series.indexOf(s) % 8) + 1})`);
      valueOf = (s, m) => C.sum(l.filter((x) => x.ym === m && (s === '그 외' ? rest.includes(x.sub) : x.sub === s)).map((x) => x.amt));
      colorOf = subColor; labelOf = (s) => `${sel} · ${s}`;
      legend = series.map((s) => `<span><i class="dot" style="background:${subColor(s)}"></i>${esc(s)}</span>`).join('');
    } else {
      series = trendCats;
      valueOf = (s, m) => C.sum(spend.filter((x) => x.ym === m && x.cat === s).map((x) => x.amt));
      colorOf = catColor; labelOf = (s) => s;
      legend = series.map((s) => `<span><i class="dot" style="background:${catColor(s)}"></i>${esc(s)}</span>`).join('');
    }
    const chart = stackedColumns(months, series, valueOf, colorOf, labelOf);

    // 변화: 마지막 달 vs 그 전 3개월 평균 (세부 분류 단위)
    // 이번 달은 아직 안 끝났으니 비교는 마지막으로 끝난 달 기준
    const lastM = months.filter((m) => m < thisYM).slice(-1)[0];
    const prev = [1, 2, 3].map((i) => C.addMonths(lastM, -i));
    const allSpend = D.items.filter((x) => x.amt !== 0);
    const changes = [];
    for (const [k, l] of C.group(allSpend.filter((x) => x.ym === lastM || prev.includes(x.ym)), (x) => `${x.cat}|${x.sub}`)) {
      const now = C.sum(l.filter((x) => x.ym === lastM).map((x) => x.amt));
      const avg = C.sum(l.filter((x) => prev.includes(x.ym)).map((x) => x.amt)) / 3;
      if (Math.abs(now - avg) >= 10000) changes.push({ k, now, avg, d: now - avg });
    }
    changes.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));

    // 습관: 요일
    const wd = [0, 1, 2, 3, 4, 5, 6].map((d) => { const l = spend.filter((x) => C.weekday(x.r.date) === d); return { d, n: l.length, v: C.sum(l.map((x) => x.amt)) }; });
    const order = [1, 2, 3, 4, 5, 6, 0];
    const wdHtml = hbars(order.map((d) => ({ label: `${C.WEEKDAYS[d]}요일`, value: wd[d].v, sub: `${wd[d].n}건`, attr: `data-drill="wd|${d}"`, tip: `<b>${C.WEEKDAYS[d]}요일</b> ${won(wd[d].v)} · ${wd[d].n}건<br>건당 평균 ${won(wd[d].n ? wd[d].v / wd[d].n : 0)}` })), 'var(--s1)');
    // 자주 가는 곳
    const byStore = [...C.group(spend.filter((x) => !x.c.agent && x.amt > 0), (x) => x.c.key)].map(([k, l]) => ({ k, l, n: l.length, v: C.sum(l.map((x) => x.amt)) }));
    const freq = byStore.slice().sort((a, b) => b.n - a.n || b.v - a.v).slice(0, 10);
    const freqHtml = hbars(freq.map((s) => ({ label: s.l[s.l.length - 1].r.store, value: s.n, valText: `${s.n}회`, sub: man(s.v), color: catColor(s.l[0].cat), attr: `data-drill="store|${esc(s.k)}"`, tip: `<b>${esc(s.l[0].r.store)}</b><br>${s.n}회 · ${won(s.v)}<br>${esc(s.l[0].cat)} · ${esc(s.l[0].sub)}` })));
    // 소액 반복 (1만원 이하)
    const small = [...C.group(spend.filter((x) => x.amt > 0 && x.amt <= 10000), (x) => `${x.cat} · ${x.sub}`)].map(([k, l]) => ({ k, n: l.length, v: C.sum(l.map((x) => x.amt)) })).filter((o) => o.n >= 4).sort((a, b) => b.v - a.v).slice(0, 8);
    const smallHtml = small.length ? hbars(small.map((s) => ({ label: s.k, value: s.v, sub: `${s.n}건`, attr: `data-drill="small|${esc(s.k)}"`, tip: `<b>${esc(s.k)}</b><br>1만원 이하 ${s.n}건, 합계 ${won(s.v)}` })), 'var(--s2)') : '<p class="muted">1만원 이하로 4번 넘게 반복된 곳이 없어요.</p>';
    // 큰 지출
    const big = spend.filter((x) => x.amt > 0).slice().sort((a, b) => b.amt - a.amt).slice(0, 8);

    // 고정 지출
    const fixedRows = recurring.map((f) => `<tr class="${f.active ? '' : 'off'}" data-drill="fixed|${esc(f.ids.join(','))}" style="cursor:pointer">
      <td>${esc(f.store)}${f.agent ? ' <span class="pill">대행사</span>' : ''}</td><td>${esc(f.cat || UNCAT)}${f.sub ? ` · ${esc(f.sub)}` : ''}</td>
      <td class="num">${won(f.amount)}</td><td class="num">매달 ${f.day}일쯤</td><td class="num">${f.count}개월</td>
      <td>${f.from.slice(0, 7)} ~ ${f.last.slice(0, 7)}</td><td>${f.active ? '진행 중' : '<span class="muted">끝난 듯</span>'}</td></tr>`).join('');

    const drill = UI.drill ? drillHtml(UI.drill) : '';
    return `
      <div class="filters">${periodControl()}<span class="muted">${range()[0]} ~ ${range()[1]}</span></div>
      ${flowCards(months, recurring)}
      <div class="tiles">
        <div class="tile"><div class="k">총지출</div><div class="v">${won(total)}</div><div class="d">${spend.length}건</div></div>
        <div class="tile"><div class="k">월평균</div><div class="v">${won(total / mCount)}</div><div class="d">${mCount}개월 기준</div></div>
        <div class="tile"><div class="k">고정 지출 (매달)</div><div class="v">${won(C.sum(activeFixed.map((f) => f.amount)))}</div><div class="d">진행 중 ${activeFixed.length}곳</div></div>
        <div class="tile"><div class="k">분류 안 된 지출</div><div class="v ${uncat.length ? 'warn' : ''}">${won(C.sum(uncat.map((x) => x.amt)))}</div><div class="d">${uncat.length}건 · 세부 없음 ${nosub.length}건</div></div>
      </div>

  function suggestFor(store, memo) {

          <div class="subs">${subs.map((s) => `<span class="chip">${esc(s)}<button class="tdel" data-sub="${esc(s)}" title="삭제">×</button></span>`).join('')}
          <input type="text" class="tadd" placeholder="+ 세부 추가" size="10"></div></div>`).join('')}

      </div>
      <div class="card"><h2>단어 규칙 · ${S.rules.length}개</h2><p class="sub">가게 이름이나 상품명에 이 단어가 들어 있으면 이 분류로 넣어요. 가게별 기억보다 먼저 적용돼서, 같은 가게라도 상품명으로 나눌 수 있어요. 한 건만 고친 분류는 이보다 먼저예요. 가계부 앱과 같은 목록을 써요.</p>
        ${S.rules.length ? `<table><tbody>${S.rules.map((r, i) => `<tr><td><b>${esc(r.kw)}</b></td><td>${esc(r.cat)}${r.sub ? ` · ${esc(r.sub)}` : ''}</td><td class="num">${D.items.filter((x) => x.c.byRule && C.matchRule(x.r, [r])).length}건</td><td><button class="btn small rdel" data-i="${i}">삭제</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">아직 없어요.</p>'}

  function bindClassify(root) {
    root.querySelectorAll('tr[data-key]').forEach((tr) => {
      const cs = $('.ccat', tr);
      cs.onchange = () => { $('.csub', tr).innerHTML = subOptions(cs.value, ''); };
      $('.csave', tr).onclick = () => {
        const key = tr.dataset.key; const cat = cs.value; const sub = $('.csub', tr).value;
        if (!cat) return toast('대분류를 골라주세요');
        S.memory[key] = { cat, sub }; if (UI.ai) delete UI.ai[key]; save(); recompute(); render();
      };
    });
    root.querySelectorAll('tr[data-id]').forEach((tr) => {
      const cs = $('.ccat', tr);
      cs.onchange = () => { $('.csub', tr).innerHTML = subOptions(cs.value, ''); };
      $('.crule', tr).onclick = () => {
        const kw = $('.ckw', tr).value.trim().toLowerCase(); const cat = cs.value; const sub = $('.csub', tr).value;
        if (!kw) return toast('단어를 적어주세요');
        if (!cat) return toast('대분류를 골라주세요');
        S.rules = S.rules.filter((r) => r.kw !== kw); S.rules.push({ kw, cat, sub });
        save(); recompute();
        const n = D.items.filter((x) => x.c.byRule && C.matchRule(x.r, [{ kw }])).length;
        render(); toast(`'${kw}' 들어간 결제 ${n}건을 ${cat}${sub ? ' · ' + sub : ''}로 분류했어요`);
      };
      $('.csave1', tr).onclick = () => {
        const id = tr.dataset.id; S.overrides[id] = { ...(S.overrides[id] || {}), cat: cs.value, sub: $('.csub', tr).value };
        save(); recompute(); render();
      };
    });
    const sa = $('#saveAllSug', root);
    if (sa) sa.onclick = () => {
      let n = 0;
      // 세부까지 골라졌거나, 대분류를 새로 고른 줄 (앱이 정한 대분류만 있고 세부가 빈 줄은 그대로 둔다)
      const filled = (tr) => { const c = $('.ccat', tr); return c.value && ($('.csub', tr).value || !c.disabled); };
      root.querySelectorAll('tr[data-key]').forEach((tr) => {
        if (!filled(tr)) return;
        S.memory[tr.dataset.key] = { cat: $('.ccat', tr).value, sub: $('.csub', tr).value }; n++;
      });
      root.querySelectorAll('tr[data-id]').forEach((tr) => {
        if (!filled(tr)) return;
        S.overrides[tr.dataset.id] = { ...(S.overrides[tr.dataset.id] || {}), cat: $('.ccat', tr).value, sub: $('.csub', tr).value }; n++;
      });
      UI.ai = null; save(); recompute(); render(); toast(`${n}건 저장했어요`);
    };
    const ma = $('#moreAgent', root); if (ma) ma.onclick = () => { UI.agentLimit = (UI.agentLimit || 60) + 200; render(); };
    root.querySelectorAll('.rdel').forEach((b) => b.onclick = () => { S.rules.splice(+b.dataset.i, 1); save(); recompute(); render(); });
    const mc = $('#moreClass', root); if (mc) mc.onclick = () => { UI.classLimit = (UI.classLimit || 80) + 200; render(); };
    const ab = $('#aiBtn', root); if (ab) ab.onclick = runAI;
    root.querySelectorAll('.treecat').forEach((el) => {
      const cat = el.dataset.cat;
      el.querySelectorAll('.tdel').forEach((b) => b.onclick = () => { S.tree[cat] = S.tree[cat].filter((s) => s !== b.dataset.sub); save(); render(); });
      $('.tadd', el).onkeydown = (e) => { if (e.key === 'Enter' && e.target.value.trim()) { S.tree[cat].push(e.target.value.trim()); save(); render(); } };
      $('.tdelcat', el).onclick = () => { if (confirm(`'${cat}' 대분류를 목록에서 뺄까요? 이미 분류한 내역은 그대로 남아요.`)) { delete S.tree[cat]; save(); render(); } };
    });
    const ac = $('#addCat', root); if (ac) ac.onclick = () => { const v = $('#newCat').value.trim(); if (v && !S.tree[v]) { S.tree[v] = []; save(); render(); } };
  }

  async function runAI() {
    const { groups } = pending();
    const todo = groups.filter((g) => !(UI.ai && UI.ai[g.key])).slice(0, 150);
    if (!todo.length) return toast('AI에 물어볼 가게가 없어요');
    const st = $('#aiStatus'); st.textContent = ` ${todo.length}곳 물어보는 중...`;
    const tree = Object.entries(S.tree).map(([c, s]) => `${c}: ${s.join(', ')}`).join('\n');
    const list = todo.map((g, i) => `${i + 1}. ${g.store}${g.cat ? ` (대분류는 ${g.cat}로 정해짐)` : ''}`).join('\n');
    const prompt = `한국 카드 결제 내역의 가게 이름을 보고 지출 분류를 골라줘.\n\n분류 목록 (대분류: 세부들):\n${tree}\n\n가게 이름:\n${list}\n\n규칙: 반드시 위 목록 안에서만 고르고, 대분류가 정해진 가게는 그 대분류 안에서 세부만 골라. 이름만으로 확신이 없으면 cat을 빈 문자열로 둬. 결제대행사 이름(토스페이먼츠, 이니시스 등)만 있으면 빈 문자열.\nJSON 배열로만 답해: [{"n":번호,"cat":"대분류","sub":"세부"}]`;
    try {
      const text = await callAI(prompt);
      const arr = JSON.parse(text.slice(text.indexOf('['), text.lastIndexOf(']') + 1));
      UI.ai = UI.ai || {};
      let n = 0;
      for (const a of arr) {
        const g = todo[a.n - 1]; if (!g || !a.cat || !S.tree[a.cat]) continue;
        if (g.cat && a.cat !== g.cat) continue;
        UI.ai[g.key] = { cat: a.cat, sub: S.tree[a.cat].includes(a.sub) ? a.sub : '' }; n++;
      }
      render(); toast(`AI가 ${n}곳을 제안했어요. 확인하고 저장하세요.`);
    } catch (e) {
      st.textContent = ` 실패: ${e.message}`;
    }
  }

        <div class="drop" id="drop2">여기에 파일을 끌어다 놓거나 <button class="btn" id="pick2">파일 고르기</button></div></div>
      <div class="card"><h2>불러온 파일 · ${files.length}개</h2>
        ${files.length ? `<table><thead><tr><th>종류</th><th>기간</th><th class="num">건수</th><th>파일 이름</th><th></th></tr></thead><tbody>${files.map((f) => `<tr><td>${esc(f.kind)}</td><td>${esc(f.label)}</td><td class="num">${f.rows.length}</td><td class="muted">${esc(f.name)}</td><td><button class="btn small fdel" data-key="${esc(f.key)}">빼기</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">아직 없어요.</p>'}</div>
      <div class="card"><h2>계산 방법</h2>
        <label><input type="checkbox" id="optTransfer" ${S.opts.excludeTransfer ? 'checked' : ''}> 송금은 지출에서 빼기</label>
        <p class="muted" style="margin:6px 0 0">할부는 결제한 달에 전체 금액으로 세고, 내역 표에 월 금액·남은 금액을 같이 보여줘요.</p></div>
      <div class="card"><h2>가계부 앱으로 보내기</h2><p class="sub">합쳐서 정리한 내역을 가계부 앱이 읽는 CSV(14열)로 저장해요. 카테고리 칸에는 대분류만 들어가고, 카드+네이버페이로 합친 건은 한 줄로 나가요. 앱의 CSV 가져오기로 넣으면 돼요.</p>
        <button class="btn" id="appOut" ${D && D.items.length ? '' : 'disabled'}>가계부 앱용 CSV 저장</button></div>
      <div class="card"><h2>백업</h2><p class="sub">분류 기억, 건별 분류, 세부 분류 목록을 파일로 저장해 다른 PC로 옮기거나 되살릴 수 있어요. 불러온 내역은 포함하지 않아요 (CSV를 다시 올리면 돼요). API 키도 넣지 않아요.</p>
        <button class="btn" id="bkOut">백업 파일 저장</button> <button class="btn" id="bkIn">백업 파일 불러오기</button></div>
      ${GAS ? `<div class="card"><h2>가계부 앱 연결 비밀번호 ${G.hasSync ? '<span class="pill">정해짐</span>' : '<span class="pill warn">아직 없음</span>'}</h2><p class="sub">가계부 앱이 이 시트에 내역을 보낼 때 쓰는 비밀번호예요. 8자 이상으로 정하고, 앱 설정에도 똑같이 넣어 주세요. 다시 정하면 앱 쪽도 바꿔야 해요.</p>
        <input type="password" id="synckey" size="30" placeholder="8자 이상"> <button class="btn" id="syncSave">${G.hasSync ? '바꾸기' : '정하기'}</button></div>` : ''}
      <div class="card"><h2>AI 자동 분류 ${GAS && G.hasAi ? '<span class="pill">키 저장됨</span>' : ''}</h2><p class="sub">Anthropic API 키를 넣으면 '분류하기'에서 AI 자동 분류 버튼을 쓸 수 있어요. ${GAS ? '키는 이 시트의 앱스 스크립트 설정에 저장되고 화면에는 다시 보이지 않아요.' : '키는 이 PC의 브라우저에만 저장돼요.'} AI에는 분류 안 된 가게 이름과 분류 목록만 보내요 (금액·날짜는 안 보내요).</p>
        <input type="password" id="apikey" size="44" placeholder="sk-ant-..." value="${GAS ? '' : esc(apiKey())}"> <button class="btn" id="keySave">저장</button> <button class="btn" id="keyDel">지우기</button></div>
      ${GAS ? '' : `<div class="card"><h2>모두 지우기</h2><p class="sub">이 브라우저에 저장된 내역·분류를 모두 지워요. 먼저 백업 파일을 저장해 두세요.</p><button class="btn" id="wipe">모두 지우기</button></div>`}`;
  }
  function bindFiles(root) {
    setupDrop($('#drop2', root), $('#pick2', root));
    root.querySelectorAll('.fdel').forEach((b) => b.onclick = () => { S.files = S.files.filter((f) => f.key !== b.dataset.key); save(); recompute(); render(); });
    $('#optTransfer', root).onchange = (e) => { S.opts.excludeTransfer = e.target.checked; save(); recompute(); render(); };
    $('#appOut', root).onclick = () => {
      const items = D.items.map((x) => {
        const ov = S.overrides[x.r.id] || {};
        return { r: x.r, cat: x.c.cat, include: ov.exclude ? false : ov.include ? true : x.r.include };
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([C.toAppCSV(items)], { type: 'text/csv' }));
      a.download = `가계부_가져오기_${todayStr}.csv`; a.click();
    };
    $('#bkOut', root).onclick = () => {
      const fp = {};
      D.rows.forEach((r) => { if (S.overrides[r.id]) fp[r.id] = { date: r.date, time: r.time || '', amount: r.amount, store: r.store }; });
      const data = { app: 'spending-analyzer', version: 1, savedAt: new Date().toISOString(), memory: S.memory, overrides: S.overrides, fingerprints: fp, tree: S.tree, dismissed: S.dismissed, opts: S.opts, rules: S.rules };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
      a.download = `지출분석_백업_${todayStr}.json`; a.click();
    };
    $('#bkIn', root).onclick = () => pickFiles('.json', async (fs) => {
      try {
        const d = JSON.parse(await fs[0].text());
        if (d.app !== 'spending-analyzer') throw new Error('지출 분석 백업 파일이 아니에요');
        const m = C.remapOverrides(d.overrides || {}, d.fingerprints, D ? D.rows : []);
        Object.assign(S, { memory: d.memory || {}, overrides: m.overrides, tree: d.tree || S.tree, dismissed: d.dismissed || {}, opts: d.opts || S.opts, rules: d.rules || [] });
        save(); recompute(); render();
        toast(`백업을 불러왔어요${m.moved ? ` · 건별 분류 ${m.moved}건을 지금 내역에 맞춰 옮김` : ''}${m.lost ? ` · ${m.lost}건은 맞는 내역을 못 찾음` : ''}`);
      } catch (e) { toast(`불러오지 못했어요: ${e.message}`); }
    });
    $('#keySave', root).onclick = async () => {
      const v = $('#apikey').value.trim();
      if (!GAS) { apiKey(v); return toast('키를 저장했어요'); }
      if (!v) return toast('키를 넣어 주세요');
      try { await gasCall('saSetAiKey', v); G.hasAi = true; render(); toast('키를 저장했어요'); } catch (e) { toast(e.message); }
    };
    $('#keyDel', root).onclick = async () => {
      if (!GAS) { apiKey(''); return render(); }
      try { await gasCall('saSetAiKey', ''); G.hasAi = false; render(); } catch (e) { toast(e.message); }
    };
    const ss = $('#syncSave', root);
    if (ss) ss.onclick = async () => {
      try { await gasCall('saSetSyncKey', $('#synckey').value); G.hasSync = true; render(); toast('비밀번호를 정했어요. 가계부 앱 설정에도 같은 값을 넣어 주세요.'); } catch (e) { toast(e.message); }
    };
    const wp = $('#wipe', root);
    if (wp) wp.onclick = () => { if (confirm('정말 모두 지울까요?')) { try { localStorage.removeItem(KEY); } catch (e) { /* */ } location.reload(); } };
    const rl = $('#sheetReload', root); if (rl) rl.onclick = loadSheet;
  }

  // ---------- 파일 읽기 ----------
  async function readText(file) {
    const buf = await file.arrayBuffer();
    let t = new TextDecoder('utf-8').decode(buf);
    if (t.includes('�')) { try { t = new TextDecoder('euc-kr').decode(buf); } catch (e) { /* utf-8 그대로 */ } }
    return t;
  }
  async function addFiles(list) {
    const msgs = [];
    for (const f of list) {
      try {
        const p = C.parseFile(f.name, await readText(f));
        if (GAS && p.key === 'app') { msgs.push(`${f.name}: 가계부 내역은 구글 시트에서 읽어요`); continue; }
        S.files = S.files.filter((x) => x.key !== p.key);
        S.files.push({ key: p.key, kind: p.kind, name: f.name, label: p.label, rows: p.rows, problems: p.problems, addedAt: Date.now() });
        msgs.push(`${p.kind} ${p.rows.length}건`);
      } catch (e) { msgs.push(`${f.name}: ${e.message}`); }
    }
    save(); recompute(); render(); toast(msgs.join(' · '));
  }
  function pickFiles(accept, cb) {
    const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.accept = accept;
    i.onchange = () => cb([...i.files]); i.click();
  }
  function setupDrop(el, btn) {
    if (!el) return;
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop = (e) => { e.preventDefault(); el.classList.remove('over'); addFiles([...e.dataTransfer.files]); };
    if (btn) btn.onclick = () => pickFiles('.csv,.xls,.html,.htm', addFiles);
  }
  // 어느 화면에서든 파일을 끌어다 놓으면 읽기
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => { if (!e.target.closest('.drop')) { e.preventDefault(); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); } });

  // ---------- 렌더 ----------
  const TABS = [['dash', '대시보드'], ['table', '내역'], ['classify', '분류하기'], ['check', '점검'], ['files', '파일·설정']];
  function render() {
    hideTip();
    const nav = $('nav');
    const pend = D && D.items.length ? pending() : { groups: [], agentRows: [] };
    const dupN = D && D.items.length ? C.findDuplicates(D.rows).filter((d) => !S.dismissed[d.key]).length : 0;
    nav.innerHTML = TABS.map(([k, l]) => {
      const n = k === 'classify' ? pend.groups.length + pend.agentRows.length : k === 'check' ? dupN : 0;
      return `<button data-tab="${k}" class="${UI.tab === k ? 'on' : ''}">${l}${n ? `<span class="badge">${n > 999 ? '999+' : n}</span>` : ''}</button>`;
    }).join('');
    nav.querySelectorAll('button').forEach((b) => b.onclick = () => { UI.tab = b.dataset.tab; UI.drill = null; render(); });
    const main = $('main');
    if (GAS && !G.loaded) {
      main.innerHTML = `<div class="card empty"><h2>${G.loading ? '구글 시트를 읽는 중이에요…' : '구글 시트를 읽지 못했어요'}</h2>${G.loading ? '' : '<p><button class="btn primary" id="retry">다시 읽기</button></p>'}</div>`;
      const rt = $('#retry'); if (rt) rt.onclick = loadSheet;
      return;
    }
    if (GAS && !D.items.length && UI.tab !== 'files') {
      main.innerHTML = `<div class="card empty"><h2>시트 '내역'이 아직 비어 있어요</h2>
        <p>가계부 앱 설정에서 이 웹 앱 주소와 연결 비밀번호를 넣고 동기화하면 여기에 내역이 보여요.<br>비밀번호는 <b>파일·설정</b> 탭에서 정해요.</p>
        <p><button class="btn" id="goFiles">파일·설정으로</button> <button class="btn" id="retry">다시 읽기</button></p></div>`;
      $('#goFiles').onclick = () => { UI.tab = 'files'; render(); };
      $('#retry').onclick = loadSheet;
      return;
    }
    if (!D.items.length && UI.tab !== 'files') {
      main.innerHTML = `<div class="card empty"><h2>지출 내역 파일을 올려주세요</h2>
        <p>가계부 앱이 구글 드라이브에 저장한 <b>가계부_내역_전체.csv</b>를 이 창에 끌어다 놓으면 돼요.<br>현대카드 명세서·실시간 이용내역(.xls)과 네이버페이 내역 CSV도 읽어요.</p>
        <div class="drop" id="drop1" style="max-width:520px;margin:20px auto 0">여기에 끌어다 놓기 · <button class="btn primary" id="pick1">파일 고르기</button></div>
        <p class="muted" style="margin-top:16px">내역은 이 PC 브라우저에만 저장되고 밖으로 나가지 않아요.</p></div>`;
      setupDrop($('#drop1'), $('#pick1'));
      return;
    }
    const views = { dash: [viewDash, bindDash], table: [viewTable, bindTable], classify: [viewClassify, bindClassify], check: [viewCheck, bindCheck], files: [viewFiles, bindFiles] };
    const [v, b] = views[UI.tab];
    main.innerHTML = v();
    b(main); bindTips(main);
  }

  recompute();
  if (GAS) loadSheet(); else render();
  window.__SA = { S, UI, G, get D() { return D; }, addFiles, render, loadSheet };
})();
</script>
</body>
</html>
